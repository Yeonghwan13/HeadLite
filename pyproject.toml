[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headlite"
version = "0.1.0"
description = "HeadLite model architecture and five-network mean prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.13.0"]

[project.urls]
Paper = "https://doi.org/10.1109/JSEN.2026.3724195"
Source = "https://github.com/Yeonghwan13/HeadLite"
Issues = "https://github.com/Yeonghwan13/HeadLite/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
