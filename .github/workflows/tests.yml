name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The CPU wheel index applies to this command only, which selects the PyTorch build.
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      # The install path the README documents: declared dependencies, then the package itself.
      - run: python -m pip install -c constraints-tested-cpu.txt -r requirements-dev.txt
      - run: python -m pip install -c constraints-tested-cpu.txt -e .
      - run: python -m pip check
      - name: The documented PyTorch build must survive the later installs
        run: python -c "import torch; assert torch.__version__.split('+')[0] == '2.9.1', torch.__version__"
      - run: python -m pytest -o addopts="-p no:cacheprovider" -rs
      - run: python examples/forward.py
      - run: python examples/forward.py --ensemble

  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel and the sdist
        run: |
          python -m pip install build
          python -m build
          ls -l dist
      - name: Install the wheel in a clean environment and import it outside the checkout
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --upgrade pip
          /tmp/wheel-env/bin/python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheel-env/bin/python -m pip install -c constraints-tested-cpu.txt dist/*.whl
          /tmp/wheel-env/bin/python -m pip check
          (cd /tmp && /tmp/wheel-env/bin/python -c "
          import headlite, torch
          from headlite import HeadLite, HeadLiteEnsemble
          assert '/tmp/wheel-env/' in headlite.__file__, headlite.__file__
          m = HeadLite().eval()
          xs = (torch.randn(2, 3, 300), torch.randn(2, 3, 300), torch.rand(2, 40, 300), torch.randn(2, 6))
          with torch.inference_mode():
              mean, variance = m(*xs)
              out = HeadLiteEnsemble([HeadLite().eval() for _ in range(5)]).eval()(*xs)
          assert mean.shape == variance.shape == out.shape == (2, 1)
          assert sum(p.numel() for p in m.parameters()) == 1732146
          print('wheel install OK', headlite.__version__, torch.__version__)
          ")
      - name: Install from the sdist and run its own tests
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install --upgrade pip
          /tmp/sdist-env/bin/python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/sdist-env/bin/python -m pip install -c constraints-tested-cpu.txt dist/*.tar.gz
          (cd /tmp && /tmp/sdist-env/bin/python -c "
          from headlite import HeadLite
          print('sdist install OK', sum(p.numel() for p in HeadLite().parameters()))
          ")
          # The sdist ships the tests, so unpacking it must give a source tree they can run in.
          mkdir -p /tmp/sdist-src && tar -xzf dist/*.tar.gz -C /tmp/sdist-src
          /tmp/sdist-env/bin/python -m pip install -c constraints-tested-cpu.txt pytest
          (cd /tmp/sdist-src/headlite-* && /tmp/sdist-env/bin/python -m pytest -o addopts="-p no:cacheprovider" -rs)
      - name: The distribution metadata must match the declared dependencies
        run: |
          python -m pip install packaging
          python - <<'PY'
          import pathlib, zipfile, tomllib
          from email.parser import Parser
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              meta = Parser().parsestr(z.read(name).decode())
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          assert meta["Requires-Python"] == declared["requires-python"], meta["Requires-Python"]
          runtime = [r for r in meta.get_all("Requires-Dist") if "extra ==" not in r]
          assert runtime == declared["dependencies"], runtime
          print("wheel metadata OK:", meta["Requires-Python"], runtime)
          PY
